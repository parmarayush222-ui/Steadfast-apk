name: Build Steadfast Complete APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o *.zip
          if [ -d "steadfast-android" ]; then
            cp -r steadfast-android/* .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Native Project & Inject Custom Java Files
        run: |
          # 1. Save custom native Java files and manifest/icons before cleaning
          mkdir -p /tmp/native_backup
          cp -r android/app/src/main/java /tmp/native_backup/ || true
          cp -r android/app/src/main/res /tmp/native_backup/ || true
          cp android/app/src/main/AndroidManifest.xml /tmp/native_backup/ || true

          # 2. Fresh native setup to avoid broken Capacitor settings references
          rm -rf android
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

          # 3. Initialize and add Android
          npx cap init Steadfast com.steadfast.app --web-dir www
          npx cap add android

          # 4. Restore original native Java files, custom icons, and Manifest
          cp -r /tmp/native_backup/java/* android/app/src/main/java/ || true
          cp -r /tmp/native_backup/res/* android/app/src/main/res/ || true
          cp /tmp/native_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml || true

          # 5. Final sync
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steadfast-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

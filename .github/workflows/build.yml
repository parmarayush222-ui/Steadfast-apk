name: Inspect and Build Original Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP & List Files
        run: |
          unzip -o *.zip || true
          echo "=== TOP LEVEL FILES ==="
          ls -la
          echo "=== SEARCHING ALL DIRECTORIES FOR GRADLEW ==="
          find . -name "gradlew"
          echo "=== SEARCHING FOR ANDROID DIRECTORY ==="
          find . -maxdepth 3 -type d -name "android"

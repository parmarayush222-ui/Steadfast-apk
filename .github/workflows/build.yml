name: Build Steadfast with Custom Icon

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o *.zip
          if [ -d "steadfast-android" ]; then
            cp -r steadfast-android/* .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Custom Icons & Build Native Project
        run: |
          # 1. Clean up and install assets tool
          npm install
          npm install @capacitor/assets --save-dev
          rm -rf android
          
          # 2. Fresh native setup (to ensure clean icon integration)
          npx cap init Steadfast com.steadfast.app --web-dir www
          npx cap add android

          # 3. Generate Android launcher icons from the root icon.png
          if [ -f "icon.png" ]; then
            npx @capacitor/assets generate --android
          fi

          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steadfast-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

name: Unzip and Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o *.zip || true
          # Find where the android folder is and bring everything to root
          ANDROID_DIR=$(find . -maxdepth 3 -type d -name "android" | head -n 1)
          if [ -n "$ANDROID_DIR" ] && [ "$ANDROID_DIR" != "./android" ]; then
            PARENT_DIR=$(dirname "$ANDROID_DIR")
            cp -r $PARENT_DIR/* .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          fi

      - name: Sync Capacitor
        run: |
          if [ -f "package.json" ]; then
            npx cap sync android || true
          fi

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steadfast-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

          
          

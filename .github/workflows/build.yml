name: Build Steadfast with Forced Custom Icon

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o *.zip
          if [ -d "steadfast-android" ]; then
            cp -r steadfast-android/* .
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick

      - name: Build Android Base
        run: |
          npm install
          npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5

          rm -rf android
          npx cap init Steadfast com.steadfast.app --web-dir www
          npx cap add android

      - name: Force Overwrite Android Launcher Icons
        run: |
          if [ -f "icon.png" ]; then
            echo "Icon found! Forcing custom launcher icon replacement..."
            
            # Target mipmap directories
            RES_DIR="android/app/src/main/res"
            
            # Resize and replace ic_launcher.png and ic_launcher_round.png in all densities
            convert icon.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher.png
            convert icon.png -resize 48x48 $RES_DIR/mipmap-mdpi/ic_launcher_round.png
            
            convert icon.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher.png
            convert icon.png -resize 72x72 $RES_DIR/mipmap-hdpi/ic_launcher_round.png
            
            convert icon.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher.png
            convert icon.png -resize 96x96 $RES_DIR/mipmap-xhdpi/ic_launcher_round.png
            
            convert icon.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher.png
            convert icon.png -resize 144x144 $RES_DIR/mipmap-xxhdpi/ic_launcher_round.png
            
            convert icon.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher.png
            convert icon.png -resize 192x192 $RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png
            
            echo "Icons replaced successfully."
          else
            echo "WARNING: icon.png was not found in the root directory!"
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steadfast-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

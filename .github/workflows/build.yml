name: Build Steadfast APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o *.zip || true
          # Find where the android directory is located
          ANDROID_PATH=$(find . -type d -name "android" | head -n 1)
          if [ -n "$ANDROID_PATH" ]; then
            echo "Found android directory at $ANDROID_PATH"
            # If it's inside a subfolder, bring everything up to the main folder
            PARENT_DIR=$(dirname "$ANDROID_PATH")
            if [ "$PARENT_DIR" != "." ]; then
              cp -r $PARENT_DIR/* .
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install || true

      - name: Sync Capacitor
        run: npx cap sync android || true

      - name: Build APK with Gradle
        run: |
          # Go to the android directory and build
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Steadfast-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
